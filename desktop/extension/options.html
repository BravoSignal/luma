<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Connect Luma</title><link rel="stylesheet" href="options.css"></head><body><main><div class="logo"><img src="icons/48.png" width="36" height="36" alt=""> luma</div><p class="eyebrow">YOUR MUSIC. ONE MOVE AWAY.</p><h1>Connect once.<br>Always within reach.</h1><p>Copy your pairing code from the Luma desktop app and paste it here. The connection stays on your computer.</p><label class="language-label" for="language">Language</label><select id="language"><option value="en">English</option><option value="de">Deutsch</option></select><form id="form"><label for="token">Your pairing code</label><input id="token" type="password" autocomplete="off" spellcheck="false" required minlength="48" maxlength="48" placeholder="Paste your Luma code"><button>Connect to Luma ↗</button></form><div id="status" role="status"></div><p class="small">Luma must be running. Reload YouTube Music once after setup. Supports Chrome, Edge and Brave on Windows and macOS.</p></main><script src="i18n.js"></script><script src="options.js"></script></body></html>
