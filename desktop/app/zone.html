<!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Widget-Bereich anpassen</title><style>

</style></head><body><header><strong>Dein Aktivierungsbereich.</strong><span>Bereich aufziehen · zum Verschieben ziehen · zum oberen Rand ziehen für randbündiges Einblenden · erst mit „Fertig“ speichern</span></header><div id="selection"><div class="preview"><div class="song"><strong>Aktivierungszone</strong><small>Widget-Größe separat in den Einstellungen wählen</small></div></div><div class="handle nw" data-handle="nw"></div><div class="handle ne" data-handle="ne"></div><div class="handle sw" data-handle="sw"></div><div class="handle se" data-handle="se"></div><div class="handle n" data-handle="n"></div><div class="handle s" data-handle="s"></div><div class="handle e" data-handle="e"></div><div class="handle w" data-handle="w"></div></div><div id="toolbar"><label>X<input id="x" type="number" aria-label="X-Position"></label><label>Y<input id="y" type="number" aria-label="Y-Position"></label><label>Breite<input id="w" type="number" min="8" aria-label="Breite"></label><label>Höhe<input id="h" type="number" min="8" aria-label="Höhe"></label><span class="separator"></span><button id="cancel">Abbrechen</button><button id="done" disabled>Fertig ✓</button></div><script src="zone.js"></script></body></html>
